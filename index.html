<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विजया ट्रेडिंग कंपनी (VTC) - एडमिन पोर्टल</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body { 
            background-color: #f1f5f9; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { 
            width: 100%;
            max-width: 450px; 
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .header-banner { 
            background: #1e3a8a; 
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .header-banner h1 { font-size: 22px; margin-bottom: 5px; }
        .header-banner p { font-size: 14px; opacity: 0.9; }
        
        h2 { text-align: center; margin-bottom: 20px; color: #1e293b; font-size: 20px;}
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #475569; font-size: 14px;}
        input { 
            width: 100%; 
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 15px;
        }
        button { 
            width: 100%; 
            padding: 12px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
        
        .dashboard { display: none; }
        .logout-btn { background: #ef4444; margin-top: 20px; }
        .logout-btn:hover { background: #dc2626; }
        
        .error-msg {
            color: #ef4444;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            font-weight: bold;
        }

        .product-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px;
            margin-bottom: 20px;
        }
        .prod-card { 
            background: #f8fafc; 
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            text-align: center;
        }
        .prod-card strong { color: #1e3a8a; display: block; margin-bottom: 4px; }
        .prod-card p { font-size: 14px; color: #64748b; }
        
        .table-container { width: 100%; overflow-x: auto; margin-top: 15px;}
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px;}
        th, td { padding: 10px; border: 1px solid #e2e8f0; text-align: left; }
        th { background-color: #1e3a8a; color: white; }
        tr:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body>

  <div class="container">
    
    <!-- एडमिन लॉगिन सेक्शन -->
    <div id="login-section">
      <div class="header-banner">
        <h1>विजया ट्रेडिंग कंपनी (VTC)</h1>
        <p>केवळ ॲडमिन लॉगिन (Admin Only)</p>
      </div>
      
      <!-- एरर मेसेज -->
      <div id="errorBox" class="error-msg">चुकीचे युझरनाव किंवा पासवर्ड!</div>

      <form id="loginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label for="username">ॲडमिन युझरनाव (Admin Username):</label>
          <input type="text" id="username" required placeholder="युझरनाव टाका">
        </div>
        <div class="form-group">
          <label for="password">पासवर्ड (Password):</label>
          <input type="password" id="password" required placeholder="पासवर्ड टाका">
        </div>
        <button type="submit">ॲडमिन लॉगिन</button>
      </form>
    </div>

    <!-- एडमिन डॅशबोर्ड सेक्शन -->
    <div class="dashboard" id="dashboardSection">
      <div class="header-banner">
        <h1>VTC ॲडमिन डॅशबोर्ड</h1>
        <p>स्वागत आहे, मुख्य ॲडमिन!</p>
      </div>
      
      <h2>उत्पादने व्यवस्थापन</h2>
      <div class="product-grid">
        <div class="prod-card">
          <strong>उत्पादन अ</strong>
          <p>किंमत: ₹५००</p>
        </div>
        <div class="prod-card">
          <strong>उत्पादन ब</strong>
          <p>किंमत: ₹१,२००</p>
        </div>
      </div>

      <h2>सर्व अलीकडील व्यवहार</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>आयडी</th>
              <th>तपशील</th>
              <th>स्थिती</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>#१०१</td>
              <td>किराणा माल खरेदी</td>
              <td style="color: green; font-weight: bold;">यशस्वी</td>
            </tr>
            <tr>
              <td>#१०२</td>
              <td>अनामत रक्कम</td>
              <td style="color: green; font-weight: bold;">यशस्वी</td>
            </tr>
          </tbody>
        </table>
      </div>

      <button class="logout-btn" onclick="handleLogout()">लॉगआउट करा</button>
    </div>

  </div>

  <script>
    // यहाँ आप अपना मनपसंद एडमिन यूजरनेम और पासवर्ड सेट कर सकते हैं
    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "vtc@admin2026";

    function handleAdminLogin(event) {
      event.preventDefault();
      
      const userInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const errorBox = document.getElementById('errorBox');

      // केवल एडमिन क्रेडेंशियल्स की जांच
      if (userInput === ADMIN_USERNAME && passwordInput === ADMIN_PASSWORD) {
        errorBox.style.display = 'none';
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
      } else {
        // गलत पासवर्ड होने पर एरर दिखाएं
        errorBox.style.display = 'block';
      }
    }

    function handleLogout() {
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('loginForm').reset();
    }
  </script>
</body>
            </html>
